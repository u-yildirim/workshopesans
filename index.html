<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esansshop × House of Her · Workshop Kartları</title>
<meta name="description" content="Esansshop × House of Her parfüm workshop'u bilgi kartları.">
<meta property="og:title" content="Esansshop × House of Her · Workshop Kartları">
<meta property="og:description" content="Parfümün tarihinden kendi parfümünü hazırlamaya 20 kart.">
<meta name="theme-color" content="#17120e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} *{box-sizing:border-box} body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one card at a time, Esansshop palette (koyu kahve, krem, altın), logo serifine eşlik eden başlıklar; kontroller başparmak için altta */
:root{
  --paper:#fbf8f2; --ink:#17120e; --muted:#6e655a; --line:#e6dccb;
  --amber:#94733a; --gold:#c8a86a; --amber-soft:#f3ead8; --on-gold:#17120e; --logo-bg:#fbf8f2;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Inter", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17120e; --ink:#f6efe1; --muted:#ab9f8c; --line:#30281f;
  --amber:#d4b67d; --gold:#c8a86a; --amber-soft:#2a2117; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17120e; --ink:#f6efe1; --muted:#ab9f8c; --line:#30281f;
  --amber:#d4b67d; --gold:#c8a86a; --amber-soft:#2a2117; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column}
.wrap{max-width:640px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding-block:16px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.logo{background:var(--logo-bg);border-radius:8px;padding:6px 10px;display:flex}
.logo img{height:30px;width:auto;display:block}
.x{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.x span{color:var(--amber);margin-right:6px}
.all-btn{font:500 14px var(--body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.all-btn:hover{border-color:var(--gold)}
.chapters{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap}
.chap{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:3px 0;border-bottom:2px solid transparent}
.chap.on{color:var(--amber);border-color:var(--gold)}
.chap+.chap::before{content:"·";margin-right:6px;color:var(--line)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:24px;touch-action:pan-y;will-change:transform}
.stage{flex:1;display:flex;flex-direction:column;overflow:hidden}
.num{font-family:var(--display);font-weight:600;font-size:clamp(68px,19vw,120px);line-height:.85;color:var(--gold);
  font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.num small{font-family:var(--body);font-size:.16em;color:var(--muted);font-weight:500;letter-spacing:.04em;margin-left:8px;vertical-align:.4em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7.4vw,42px);line-height:1.1;margin:18px 0 16px;text-wrap:balance}
.body p{margin:0 0 12px;max-width:60ch}
.body ol{margin:0 0 12px;padding-left:1.3em}
.body li{margin-bottom:6px}
.body li::marker{color:var(--amber);font-weight:600}
.tag{font-family:var(--display);font-style:italic;font-weight:500;font-size:1.25em;line-height:1.35;color:var(--amber);margin:8px 0 0;padding-left:14px;border-left:2px solid var(--gold)}
.extra{margin-top:20px;background:var(--amber-soft);border-radius:10px;padding:12px 16px;font-weight:600}
.extra b{color:var(--amber);font-weight:600;display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.code{margin-top:22px;font-weight:500;background:var(--ink);color:var(--paper);border-radius:10px;padding:14px 16px}
.code strong{letter-spacing:.06em;color:var(--gold);font-weight:600}
nav{position:sticky;bottom:0;background:var(--paper);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:12px 0 calc(14px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line)}
nav button{font:600 15px var(--body);border:0;border-radius:999px;padding:12px 20px;cursor:pointer;min-height:48px}
#prev{justify-self:start;background:transparent;color:var(--ink);border:1px solid var(--line)}
#next{justify-self:end;background:var(--gold);color:var(--on-gold)}
nav button:disabled{opacity:.35;cursor:default}
.bar{width:min(160px,30vw);height:3px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#list{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#list .in{max-width:640px;margin:0 auto}
#list h2{font-family:var(--display);font-size:28px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
#list h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:20px 0 6px}
#list button.item{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:10px 0;font:500 15.5px var(--body);color:var(--ink);cursor:pointer}
#list button.item span{font-family:var(--display);font-weight:700;font-size:1.15em;color:var(--gold);min-width:2ch;font-variant-numeric:tabular-nums}
.hint{display:none;font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;letter-spacing:.02em}
.mid{display:flex;flex-direction:column;align-items:center}
@media (pointer:coarse){.hint{display:block}}
@media (prefers-reduced-motion:no-preference){main.in-next{animation:fromR .28s ease}main.in-prev{animation:fromL .28s ease}}
@keyframes fromR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@media (max-width:560px){
  body{font-size:15.5px;line-height:1.6}
  .wrap{padding-block:10px 0}
  header{padding-bottom:10px;gap:8px}
  .brand{gap:6px;flex-wrap:nowrap}
  .logo{padding:4px 7px;border-radius:6px}
  .logo img{height:20px}
  .x{font-size:15px}
  .x span{margin-right:3px}
  .all-btn{font-size:12.5px;padding:5px 10px}
  .chapters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
  .chapters::-webkit-scrollbar{display:none}
  .chap{white-space:nowrap;font-size:11px}
  main{justify-content:flex-start;padding-block:18px 20px}
  .num{font-size:68px}
  h1{font-size:28px;margin:10px 0 12px}
  .tag{font-size:1.15em}
  .extra,.code{padding:11px 14px;font-size:15px}
  nav{padding:10px 0 calc(10px + env(safe-area-inset-bottom, 0px));gap:8px}
  nav button{font-size:14px;padding:10px 16px;min-height:44px}
  .bar{width:min(120px,28vw)}
}
</style>
</head>

const CH=[["Tarih",1,4],["Hammaddeler",5,8],["Esans",9,13],["Kullanım",14,17],["Hazırlama",18,19],["Anı",20,20]];
const C=[
["Adını bildiğimiz ilk parfümcü bir kadındı",["Yaklaşık 3.200 yıl önce Asur sarayında Tapputi adında bir kadın çiçekleri, yağları ve kokulu otları suyla karıştırıp süzerek parfüm yapıyordu. Adı bir kil tablete yazılmış. Tarihte adı bilinen ilk parfümcü o."],"Bugün bu masada oturan herkes onun mesleğini yapıyor."],
["Kokuyu buharla yakalamak",["Bir çiçeğin kokusunu buharla ayırıp şişeye almak, yani damıtma, Orta Çağ'da İslam dünyasında gelişti. Kaynaklarda bu yöntem İbn Sina'nın adıyla birlikte anılır. Gül suyu da bu yolla üretildi."],"Bugünkü parfümün temeli bir damıtma kabında atıldı."],
["Parfüm, kötü kokuyu kapatmak için doğdu",["Fransa'nın Grasse şehri eskiden tabakhanelerin kokusuyla bilinirdi. Deri eldivenler o kadar ağır kokuyordu ki eldivenciler onları parfümlemeye başladı. Zamanla eldivenciler parfümcüye, Grasse de dünyanın parfüm başkentine dönüştü."],"Kötü bir kokudan bir meslek çıktı."],
["Kolonyanın adı bir şehirden geliyor",["1700'lerin başında Almanya'nın Köln şehrinde \"Eau de Cologne\", yani Köln suyu üretildi. Ferah, narenciyeli bu su kısa sürede bütün Avrupa'ya yayıldı. Bizim kolonyamızın adı da buradan geliyor."],"Çoğumuz kokuyla ilk kez bir kolonya şişesinde tanıştık."],
["Dünyanın gülü buradan çıkıyor",["Dünyadaki gül yağının yaklaşık üçte ikisi Türkiye'den çıkıyor, merkezi Isparta. Güller her sabah 05.00 ile 10.00 arası, güneş kokuyu uçurmadan elle toplanıyor. 1 kilo gül yağı için 3-4 ton gül gerekiyor."],"Bir damla gül yağında bir bahçe var."],
["Vanilyanın sırrını 12 yaşında bir çocuk çözdü",["Vanilya çiçeği kendi başına meyve vermiyordu. 1841'de Réunion adasında köle olarak yaşayan 12 yaşındaki Edmond Albius, çiçeği elle tozlaştırmanın yolunu buldu. Vanilya onun bulduğu yöntem sayesinde dünyaya yayıldı."],"En sevilen kokulardan birinin arkasında adı unutulmuş bir çocuk var."],
["Oud, yaralanan bir ağacın kokusu",["Agarwood ağacı yaralandığında ya da bir mantar bulaştığında kendini korumak için koyu bir reçine üretiyor. Oud o reçine. Sağlıklı ağaç kokmuyor, koku ağacın kendini iyileştirme çabasından çıkıyor. Bu yüzden dünyanın en pahalı hammaddelerinden biri."],"Bazen en güzel koku bir yaradan çıkar."],
["Bazı kokular denizden gelir",["Gri amber, yani ambergris, ispermeçet balinalarının sindirim sisteminde oluşan mumsu bir madde. Her balinada oluşmuyor, tahminlere göre yalnızca çok küçük bir kısmında. Yüzyıllarca parfümün en değerli malzemelerinden biri oldu. Bugün o koku neredeyse her zaman laboratuvarda yapılıyor."],"Balinayı rahat bırakan da bir koku molekülü."],
["Bir parfüm üç şeyden oluşur",["Koku yağı yani esans, alkol ve çok az su. Şişedeki sıvının çoğu alkoldür, kokuyu taşıyan kısım ise esanstır. Alkol kokuyu tenine taşır ve buharlaşır, geride esans kalır."],"Parfümün kalbi, şişenin en küçük kısmında."],
["EDP bir yasa değil, bir oran",["Parfüm, EDP ve EDT etiketlerinin yasal bir tanımı yok. Hepsi esansın alkole oranını anlatıyor ve her marka bu oranı farklı belirliyor. Genelde EDT'de yüzde 8-15, EDP'de yüzde 12-20, parfümde yüzde 20-40 civarı esans oluyor. Aralıklar birbirine bile giriyor."],"Etiketi marka yazar. Bugün oranı sen belirliyorsun.",["Senin şişen için önerilen oran","%30 · 50 ML şişe için 15 ML esans + 35 ML solüsyon"]],
["Muadil esans ne demek?",["Muadil esans, sevilen bir parfümün koku profilinden ilham alınarak üretilen koku yağıdır. Aynı koku ailesinde, aynı notalarla hazırlanır. Tende herkeste biraz farklı açılır, bu orijinal parfüm için de geçerli."],"En doğru karşılaştırma, 14 gün sonra kendi teninde yapacağın karşılaştırma."],
["Parfümün üç katı var",["Üst notalar ilk 15 dakika duyulur ve uçar. Orta notalar birkaç saat kalır, kokunun kalbi onlardır. Alt notalar gün boyu teninde kalır. Örneğin Delina önce liçi ve raventle açılır, gül ve vanilya sonra gelir.","Masandaki koku kağıdını şimdi kokla, bir saat sonra tekrar kokla. Aynı kokunun ne kadar değiştiğini göreceksin."],"Bir parfümü ilk saniyesiyle değil, akşamki haliyle tanırsın."],
["Paran kokuya gitsin",["Bir parfümün fiyatında şişenin, ambalajın, reklamın ve dağıtımın payı büyük. Esans aldığında ödediğin para kokunun kendisine gider. Üstelik oranı sen belirlersin: yüzde 30'la parfüm yoğunluğunda bir koku elde edersin.","30 ML esanstan 2 adet 50 ML parfüm çıkar."],"Bugün masanda iki kişiye bir kit olmasının sebebi bu."],
["Parfümü tende seç, kağıtta değil",["Koku kağıdı sana sadece üst notaları gösterir. Ten ise kendi sıcaklığıyla kokuyu değiştirir, aynı parfüm iki farklı kişide farklı kokar. Bir parfüme karar vermeden önce bileğine sık ve birkaç saat bekle."],"Kağıt tanıştırır, ten karar verir."],
["Burnun yorulunca kahve kokladın mı?",["Mağazalarda burnun sıfırlansın diye kahve çekirdeği koklatırlar. Bir araştırma bunun temiz havadan daha iyi çalışmadığını gösterdi. Kokular birbirine karışmaya başladıysa bir dakika masadan kalk, açık havaya çık, nefes al."],"Burnun da mola verir. Ona izin ver."],
["Mevsimin de bir kokusu var",["Sıcakta koku daha hızlı yayılır ve daha hızlı uçar. Bu yüzden yazın ferah ve hafif kokular, kışın tatlı ve yoğun kokular daha iyi durur. Bugün masadakiler arasında yaz için Wood Sage & Sea Salt ve Bamboo Harmony, kış için Lost Cherry ve Pistachio Gelato'yu deneyebilirsin."],"Gardırobun gibi, kokunun da mevsimi var."],
["Sıktıktan sonra bileklerini sürtme",["Parfümü nabız noktalarına sık: bilek içi, boyun yanları, kulak arkası. Bu bölgeler sıcak olduğu için koku daha iyi yayılır. Sıktıktan sonra bileklerini birbirine sürtme. Sürtünme kokuyu ısıtır ve üst notaları hızla uçurur."],"Sık, bırak, kendi kurusun."],
["Kendi parfümünü dört adımda hazırla",[["Şırıngayla 15 ML esansı ölç ve şişeye dök.","Solüsyon iğnesini tak, 35 ML solüsyonu ölç ve şişeye ekle.","Şişenin borusunu boyuna göre kes, valfi aparatla kapat.","Şişeyi 2 dakika boyunca güçlüce çalkala."]],"Bugün oranı da, kokuyu da sen seçtin."],
["Parfümün de beklemeye ihtiyacı var",["Parfümcüler karışımlarını şişelemeden önce haftalarca dinlendirir. Bu sürede esans ile alkol birbirine alışıyor ve koku yerine oturuyor. Şişeni ışık almayan, serin bir yerde beklet. Banyo rafı ve pencere önü olmaz.","Eve gidince hemen kokladığında koku biraz keskin gelebilir. Bu normal. Dinlendikçe yumuşar ve daha kalıcı hale gelir. Serin ve karanlıkta, kapağı kapalı saklanan bir parfüm yıllarca kullanılır."],"Sabır, karışımın son malzemesi.",["Senin şişen için bekleme süresi","En az 14 gün"]],
["Kokular seni çocukluğuna götürür",["Kokunun hatırlattığı anıların çoğu hayatımızın ilk on yılından geliyor. Bir araştırmaya göre kokuyla gelen anılar, kelimeyle ya da fotoğrafla gelenlerden daha çok \"o ana geri dönmüş gibi\" hissettiriyor."],"Bugün yaptığın şişe, bir gün birinin anısı olacak.",null,true]
];
const N=C.length; let i=0;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chapterOf(n){return CH.findIndex(c=>n>=c[1]&&n<=c[2])}
$("#chapters").innerHTML=CH.map(c=>`<span class="chap">${c[0]}</span>`).join("");
function render(dir){
  const [h,body,tag,extra,last]=C[i], n=i+1;
  let html=`<div class="num">${String(n).padStart(2,"0")}<small>/ ${N}</small></div><h1>${esc(h)}</h1><div class="body">`;
  body.forEach(p=>{ html+= Array.isArray(p)? `<ol>${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>` : `<p>${esc(p)}</p>`});
  html+=`</div><p class="tag">${esc(tag)}</p>`;
  if(extra) html+=`<div class="extra"><b>${esc(extra[0])}</b>${esc(extra[1])}</div>`;
  if(last) html+=`<p class="code">esansshop.com'da <strong>HOUSEOFHER</strong> koduyla %10 indirim seni bekliyor.</p>`;
  const m=$("#card"); m.innerHTML=html; m.style.transform=""; m.style.opacity=""; m.classList.remove("in-next","in-prev"); if(dir){void m.offsetWidth; m.classList.add(dir>0?"in-next":"in-prev")}
  const k=chapterOf(n); document.querySelectorAll(".chap").forEach((e,j)=>{e.classList.toggle("on",j===k); if(j===k){try{e.scrollIntoView({inline:"center",block:"nearest"})}catch(_){}}});
  $("#bar").style.width=(n/N*100)+"%";
  $("#prev").disabled=i===0; $("#next").disabled=i===N-1;
  try{ history.replaceState(null,"","#kart-"+n) }catch(e){}
}
function go(d){ const j=Math.min(N-1,Math.max(0,i+d)); if(j!==i){i=j;render(d);window.scrollTo(0,0)} }
$("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{ if(!$("#list").hidden){ if(e.key==="Escape") $("#list").hidden=true; return }
  if(e.key==="ArrowRight"||e.key===" ") {e.preventDefault();go(1)} if(e.key==="ArrowLeft") go(-1) });
let sx=null,sy=null,st=0,lock=null,dx=0;
const card=$("#card"), stage=document.querySelector(".stage");
stage.addEventListener("touchstart",e=>{ if(e.touches.length>1) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now(); lock=null; dx=0; card.style.transition="none" },{passive:true});
stage.addEventListener("touchmove",e=>{ if(sx===null) return;
  const x=e.touches[0].clientX-sx, y=e.touches[0].clientY-sy;
  if(lock===null && (Math.abs(x)>10||Math.abs(y)>10)) lock=Math.abs(x)>Math.abs(y)?"x":"y";
  if(lock!=="x") return;
  e.preventDefault(); dx=x;
  const edge=(i===0&&dx>0)||(i===N-1&&dx<0); const d=edge?dx*0.25:dx;
  card.style.transform=`translateX(${d}px)`; card.style.opacity=String(1-Math.min(Math.abs(d)/600,.35));
},{passive:false});
stage.addEventListener("touchend",()=>{ if(sx===null) return;
  const v=Math.abs(dx)/Math.max(1,Date.now()-st); card.style.transition="transform .2s ease, opacity .2s ease";
  const dir=dx<0?1:-1, can=(dir>0&&i<N-1)||(dir<0&&i>0);
  if(lock==="x" && can && (Math.abs(dx)>60 || (v>0.45&&Math.abs(dx)>25))){ card.style.transition="none"; go(dir) }
  else { card.style.transform=""; card.style.opacity="" }
  sx=null; lock=null; dx=0 });
$("#listBody").innerHTML=CH.map(c=>`<h3>${c[0]}</h3>`+C.slice(c[1]-1,c[2]).map((x,j)=>`<button class="item" data-n="${c[1]+j}"><span>${c[1]+j}</span>${esc(x[0])}</button>`).join("")).join("");
$("#listBody").onclick=e=>{const b=e.target.closest(".item"); if(!b) return; i=+b.dataset.n-1; $("#list").hidden=true; render(); window.scrollTo(0,0)};
$("#openList").onclick=()=>{$("#list").hidden=false}; $("#closeList").onclick=()=>{$("#list").hidden=true};
const mh=(location.hash||"").match(/^#kart-(\d+)$/); if(mh){const v=+mh[1]; if(v>=1&&v<=N) i=v-1}
render();
</script>

</body>
</html>
